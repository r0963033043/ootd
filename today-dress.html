<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Today's Dress</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  h1 {
    color: #2c3e50;
    margin-bottom: 8px;
    font-size: 28px;
  }

  .subtitle {
    color: #7f8c8d;
    margin-bottom: 24px;
    font-size: 14px;
  }

  .weather {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(135deg, #6dd5ed 0%, #2193b0 100%);
    color: #fff;
    border-radius: 18px;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(33, 147, 176, 0.25);
    user-select: none;
    position: relative;
    z-index: 2;
  }

  .weather-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px 20px 6px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    opacity: 0.95;
  }

  .weather-pin {
    font-size: 12px;
    line-height: 1;
  }

  .weather-viewport {
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
  }

  .weather-viewport.dragging { cursor: grabbing; }

  .weather-track {
    display: flex;
    transition: transform 0.3s ease;
  }

  .weather-track.no-transition { transition: none; }

  .weather-page {
    flex: 0 0 100%;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 96px;
  }

  .weather-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 0 0 10px;
  }

  .weather-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    transition: background 0.2s, width 0.2s;
    cursor: pointer;
  }

  .weather-dot.active {
    background: rgba(255, 255, 255, 0.95);
    width: 16px;
    border-radius: 3px;
  }

  .weather-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .weather-day {
    font-size: 11px;
    opacity: 0.85;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .weather-location {
    font-size: 12px;
    opacity: 0.85;
    letter-spacing: 0.5px;
  }

  .weather-temp {
    font-size: 32px;
    font-weight: 600;
    line-height: 1.1;
    display: inline-block;
    align-self: flex-start;
  }

  .has-real {
    position: relative;
    cursor: help;
  }

  .has-real::after {
    content: "Real " attr(data-real);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 5;
  }

  .has-real:hover::after { opacity: 1; }

  .has-alt {
    position: relative;
    cursor: help;
  }

  .has-alt::after {
    content: attr(data-alt);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 5;
  }

  .has-alt:hover::after { opacity: 1; }

  .weather-page[data-day="tomorrow"] .weather-hilo {
    font-size: 22px;
    font-weight: 600;
    margin-top: 6px;
  }

  .weather-page[data-day="tomorrow"] .weather-hilo .sep {
    font-weight: 400;
  }

  .weather-hilo {
    font-size: 12px;
    opacity: 0.9;
    margin-top: 2px;
  }

  .weather-hilo .sep {
    opacity: 0.5;
    margin: 0 4px;
  }

  .weather-condition {
    font-size: 13px;
    opacity: 0.95;
  }

  .weather-rain {
    font-size: 12px;
    opacity: 0.9;
    margin-top: 2px;
  }

  .weather-right {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .weather-icon {
    font-size: 44px;
    line-height: 1;
  }

  .weather-suggest {
    font-size: 11px;
    opacity: 0.9;
    text-align: right;
    max-width: 110px;
  }

  .outfit {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .block {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    overflow: hidden;
    user-select: none;
  }

  .block-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: #fafbfc;
    border-bottom: 1px solid #eef0f3;
    font-size: 13px;
    font-weight: 600;
    color: #7f8c8d;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .counter {
    font-size: 11px;
    color: #b0b6bd;
    letter-spacing: 0;
    text-transform: none;
  }

  .viewport {
    position: relative;
    height: 160px;
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
  }

  .viewport.dragging { cursor: grabbing; }

  .track {
    display: flex;
    height: 100%;
    transition: transform 0.3s ease;
  }

  .track.no-transition { transition: none; }

  .item {
    flex: 0 0 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px;
  }

  .item-icon {
    font-size: 60px;
    line-height: 1;
  }

  .item-name {
    font-size: 16px;
    font-weight: 500;
    color: #2c3e50;
  }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid #eef0f3;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    color: #7f8c8d;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    transition: background 0.15s, color 0.15s;
  }

  .arrow:hover { background: #fff; color: #2c3e50; }
  .arrow.left { left: 8px; }
  .arrow.right { right: 8px; }

  .hint {
    margin-top: 16px;
    font-size: 12px;
    color: #95a5a6;
  }
</style>
</head>
<body>
  <h1>Today's Dress</h1>
  <p class="subtitle">Swipe each block to pick your look</p>

  <div class="weather" id="weather">
    <div class="weather-header">
      <span class="weather-pin">📍</span>
      <span data-field="location">Locating…</span>
    </div>
    <div class="weather-viewport">
      <div class="weather-track">
        <div class="weather-page" data-day="today">
          <div class="weather-left">
            <span class="weather-day">Today</span>
            <span class="weather-temp has-real" data-field="temp" data-real="--°">--°</span>
            <span class="weather-hilo">
              L: <span class="has-real" data-field="lo" data-real="--°">--°</span>
              <span class="sep">·</span>
              H: <span class="has-real" data-field="hi" data-real="--°">--°</span>
            </span>
            <span class="weather-condition" data-field="condition">Loading weather</span>
            <span class="weather-rain" data-field="rain"></span>
          </div>
          <div class="weather-right">
            <span class="weather-icon" data-field="icon">⛅</span>
            <span class="weather-suggest" data-field="suggest"></span>
          </div>
        </div>
        <div class="weather-page" data-day="tomorrow">
          <div class="weather-left">
            <span class="weather-day">Tomorrow</span>
            <span class="weather-hilo">
              L: <span class="has-real" data-field="lo" data-real="--°">--°</span>
              <span class="sep">·</span>
              H: <span class="has-real" data-field="hi" data-real="--°">--°</span>
            </span>
            <span class="weather-condition" data-field="condition">Loading…</span>
            <span class="weather-rain" data-field="rain"></span>
          </div>
          <div class="weather-right">
            <span class="weather-icon" data-field="icon">⛅</span>
            <span class="weather-suggest" data-field="suggest"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="weather-dots">
      <span class="weather-dot active" data-index="0"></span>
      <span class="weather-dot" data-index="1"></span>
    </div>
  </div>

  <div class="outfit">
    <div class="block" data-category="top">
      <div class="block-label">
        <span>Top</span>
        <span class="counter"></span>
      </div>
      <div class="viewport">
        <div class="track"></div>
        <div class="arrow left">&#10094;</div>
        <div class="arrow right">&#10095;</div>
      </div>
    </div>

    <div class="block" data-category="bottom">
      <div class="block-label">
        <span>Bottom</span>
        <span class="counter"></span>
      </div>
      <div class="viewport">
        <div class="track"></div>
        <div class="arrow left">&#10094;</div>
        <div class="arrow right">&#10095;</div>
      </div>
    </div>

    <div class="block" data-category="footwear">
      <div class="block-label">
        <span>Footwear</span>
        <span class="counter"></span>
      </div>
      <div class="viewport">
        <div class="track"></div>
        <div class="arrow left">&#10094;</div>
        <div class="arrow right">&#10095;</div>
      </div>
    </div>
  </div>

  <p class="hint">Tip: drag, swipe, or use the arrows</p>

<script>
  const WMO = {
    0:  { icon: "☀️", text: "Clear sky" },
    1:  { icon: "🌤️", text: "Mainly clear" },
    2:  { icon: "⛅", text: "Partly cloudy" },
    3:  { icon: "☁️", text: "Overcast" },
    45: { icon: "🌫️", text: "Fog" },
    48: { icon: "🌫️", text: "Rime fog" },
    51: { icon: "🌦️", text: "Light drizzle" },
    53: { icon: "🌦️", text: "Drizzle" },
    55: { icon: "🌧️", text: "Heavy drizzle" },
    61: { icon: "🌧️", text: "Light rain" },
    63: { icon: "🌧️", text: "Rain" },
    65: { icon: "🌧️", text: "Heavy rain" },
    71: { icon: "🌨️", text: "Light snow" },
    73: { icon: "🌨️", text: "Snow" },
    75: { icon: "❄️", text: "Heavy snow" },
    80: { icon: "🌦️", text: "Rain showers" },
    81: { icon: "🌧️", text: "Rain showers" },
    82: { icon: "⛈️", text: "Violent showers" },
    95: { icon: "⛈️", text: "Thunderstorm" },
    96: { icon: "⛈️", text: "Thunderstorm + hail" },
    99: { icon: "⛈️", text: "Severe storm" }
  };

  function suggestOutfit(tempC, code) {
    if ([61,63,65,80,81,82,95,96,99].includes(code)) return "Bring an umbrella";
    if ([71,73,75].includes(code)) return "Bundle up, it's snowy";
    if (tempC >= 28) return "Stay cool & light";
    if (tempC >= 22) return "T-shirt weather";
    if (tempC >= 15) return "A light layer";
    if (tempC >= 8)  return "Wear a jacket";
    return "Bundle up warm";
  }

  const todayPage    = document.querySelector('.weather-page[data-day="today"]');
  const tomorrowPage = document.querySelector('.weather-page[data-day="tomorrow"]');

  function rainText(prob, mm) {
    if (prob == null) return "";
    if (prob < 20) return `🌂 No rain expected · ${prob}%`;
    const amount = mm != null && mm > 0 ? ` · ${mm}mm` : "";
    if (prob < 50) return `☂️ Slight chance of rain · ${prob}%${amount}`;
    if (prob < 80) return `🌧️ Likely rain · ${prob}%${amount}`;
    return `🌧️ Rain expected · ${prob}%${amount}`;
  }

  function fillPage(page, { feelsC, realC, code, feelsHi, feelsLo, realHi, realLo, rainProb, rainMm, label }) {
    const w = WMO[code] || { icon: "🌡️", text: "Unknown" };

    const tempEl = page.querySelector('[data-field="temp"]');
    if (tempEl && feelsC !== undefined) {
      tempEl.textContent = `${feelsC}°C`;
      tempEl.setAttribute("data-real", `${realC}°C`);
    }

    const loEl = page.querySelector('[data-field="lo"]');
    const hiEl = page.querySelector('[data-field="hi"]');
    loEl.textContent = `${feelsLo}°`;
    loEl.setAttribute("data-real", `${realLo}°`);
    hiEl.textContent = `${feelsHi}°`;
    hiEl.setAttribute("data-real", `${realHi}°`);

    page.querySelector('[data-field="condition"]').textContent = w.text;
    page.querySelector('[data-field="icon"]').textContent      = w.icon;
    page.querySelector('[data-field="suggest"]').textContent   = suggestOutfit(feelsC ?? feelsHi, code);

    const rainEl = page.querySelector('[data-field="rain"]');
    if (rainEl) rainEl.textContent = rainText(rainProb, rainMm);
  }

  function setLocation(label) {
    const locField = document.querySelector('.weather-header [data-field="location"]');
    if (!locField || !label) return;
    const localName = label.local || label.en || "Your location";
    locField.textContent = localName;
    if (label.en && label.en !== localName) {
      locField.classList.add("has-alt");
      locField.setAttribute("data-alt", label.en);
    } else {
      locField.classList.remove("has-alt");
      locField.removeAttribute("data-alt");
    }
  }

  async function loadWeather() {
    const fetchWeather = async (lat, lon, label) => {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
        + `&current=temperature_2m,apparent_temperature,weather_code`
        + `&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,weather_code,precipitation_probability_max,precipitation_sum`
        + `&timezone=auto&forecast_days=2`;
      const res = await fetch(url);
      const data = await res.json();

      setLocation(label);

      const roundOrNull = v => v == null ? null : Math.round(v);

      fillPage(todayPage, {
        feelsC:  Math.round(data.current.apparent_temperature),
        realC:   Math.round(data.current.temperature_2m),
        code:    data.current.weather_code,
        feelsHi: Math.round(data.daily.apparent_temperature_max[0]),
        feelsLo: Math.round(data.daily.apparent_temperature_min[0]),
        realHi:  Math.round(data.daily.temperature_2m_max[0]),
        realLo:  Math.round(data.daily.temperature_2m_min[0]),
        rainProb: data.daily.precipitation_probability_max?.[0],
        rainMm:  roundOrNull(data.daily.precipitation_sum?.[0]),
      });

      fillPage(tomorrowPage, {
        code:    data.daily.weather_code[1],
        feelsHi: Math.round(data.daily.apparent_temperature_max[1]),
        feelsLo: Math.round(data.daily.apparent_temperature_min[1]),
        realHi:  Math.round(data.daily.temperature_2m_max[1]),
        realLo:  Math.round(data.daily.temperature_2m_min[1]),
        rainProb: data.daily.precipitation_probability_max?.[1],
        rainMm:  roundOrNull(data.daily.precipitation_sum?.[1])
      });
    };

    const fallback = async () => {
      try { await fetchWeather(25.0330, 121.5654, { local: "臺北", en: "Taipei" }); }
      catch {
        setLocation({ local: "Weather unavailable" });
        todayPage.querySelector('[data-field="condition"]').textContent = "";
      }
    };

    const COUNTRY_LANG = {
      tw: "zh-TW", cn: "zh-CN", hk: "zh-HK", mo: "zh", sg: "zh",
      jp: "ja", kr: "ko", th: "th", vn: "vi",
      fr: "fr", de: "de", es: "es", it: "it", pt: "pt", nl: "nl",
      ru: "ru", ua: "uk", pl: "pl", tr: "tr",
      gr: "el", il: "he", sa: "ar", ae: "ar", eg: "ar"
    };

    const reverseGeocode = async (lat, lon) => {
      const fetchNom = async (lang) => {
        const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=12&accept-language=${encodeURIComponent(lang)}`;
        const res = await fetch(url);
        return res.json();
      };
      const pickDistrict = (a) => a?.suburb || a?.city_district || a?.district || a?.quarter || a?.neighbourhood || a?.borough;
      const pickCity     = (a) => a?.city || a?.town || a?.village || a?.county || a?.state;
      const compose = (a) => {
        const d = pickDistrict(a), c = pickCity(a);
        if (d && c && d !== c) return `${d}, ${c}`;
        return d || c || "";
      };
      try {
        const enData = await fetchNom("en");
        const cc = (enData?.address?.country_code || "").toLowerCase();
        const localLang = COUNTRY_LANG[cc];
        const localData = localLang ? await fetchNom(localLang) : enData;
        return {
          local: compose(localData?.address) || compose(enData?.address) || "Your location",
          en:    compose(enData?.address)
        };
      } catch {
        return { local: "Your location", en: "" };
      }
    };

    if (!navigator.geolocation) return fallback();

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude } = pos.coords;
        try {
          const label = await reverseGeocode(latitude, longitude);
          await fetchWeather(latitude, longitude, label);
        }
        catch { fallback(); }
      },
      () => fallback(),
      { timeout: 6000 }
    );
  }

  loadWeather();

  (function setupWeatherSwipe() {
    const viewport = document.querySelector(".weather-viewport");
    const track    = document.querySelector(".weather-track");
    const dots     = document.querySelectorAll(".weather-dot");
    const pages    = 2;
    let index = 0;
    let startX = 0, currentX = 0, isDragging = false;
    let width = viewport.clientWidth;

    const goTo = (i, animate = true) => {
      index = Math.max(0, Math.min(pages - 1, i));
      track.classList.toggle("no-transition", !animate);
      track.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach((d, n) => d.classList.toggle("active", n === index));
    };

    const onStart = (x) => {
      isDragging = true;
      startX = x; currentX = x;
      width = viewport.clientWidth;
      viewport.classList.add("dragging");
      track.classList.add("no-transition");
    };

    const onMove = (x) => {
      if (!isDragging) return;
      currentX = x;
      const delta = currentX - startX;
      track.style.transform = `translateX(calc(-${index * 100}% + ${delta}px))`;
    };

    const onEnd = () => {
      if (!isDragging) return;
      isDragging = false;
      viewport.classList.remove("dragging");
      const delta = currentX - startX;
      const threshold = width * 0.2;
      if (delta > threshold) goTo(index - 1);
      else if (delta < -threshold) goTo(index + 1);
      else goTo(index);
    };

    viewport.addEventListener("touchstart", e => onStart(e.touches[0].clientX), { passive: true });
    viewport.addEventListener("touchmove",  e => onMove(e.touches[0].clientX),  { passive: true });
    viewport.addEventListener("touchend",   onEnd);

    viewport.addEventListener("mousedown", e => { e.preventDefault(); onStart(e.clientX); });
    window.addEventListener("mousemove", e => onMove(e.clientX));
    window.addEventListener("mouseup", onEnd);

    dots.forEach((d, n) => d.addEventListener("click", () => goTo(n)));

    goTo(0, false);
  })();

  const wardrobe = {
    top: [
      { icon: "👕", name: "White T-Shirt" },
      { icon: "👔", name: "Blue Shirt" },
      { icon: "🧥", name: "Denim Jacket" },
      { icon: "🥋", name: "Knit Sweater" },
      { icon: "🎽", name: "Tank Top" }
    ],
    bottom: [
      { icon: "👖", name: "Blue Jeans" },
      { icon: "🩳", name: "Khaki Shorts" },
      { icon: "👗", name: "Black Skirt" },
      { icon: "🩱", name: "Chinos" }
    ],
    footwear: [
      { icon: "👟", name: "White Sneakers" },
      { icon: "👞", name: "Brown Loafers" },
      { icon: "🥾", name: "Hiking Boots" },
      { icon: "🩴", name: "Sandals" },
      { icon: "👠", name: "Heels" }
    ]
  };

  document.querySelectorAll(".block").forEach(block => {
    const category = block.dataset.category;
    const items = wardrobe[category];
    const track = block.querySelector(".track");
    const viewport = block.querySelector(".viewport");
    const counter = block.querySelector(".counter");
    const leftArrow = block.querySelector(".arrow.left");
    const rightArrow = block.querySelector(".arrow.right");

    items.forEach(item => {
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `<div class="item-icon">${item.icon}</div><div class="item-name">${item.name}</div>`;
      track.appendChild(el);
    });

    let index = 0;
    let startX = 0;
    let currentX = 0;
    let isDragging = false;
    let width = viewport.clientWidth;

    const updateCounter = () => {
      counter.textContent = `${index + 1} / ${items.length}`;
    };

    const goTo = (i, animate = true) => {
      index = (i + items.length) % items.length;
      track.classList.toggle("no-transition", !animate);
      track.style.transform = `translateX(-${index * 100}%)`;
      updateCounter();
    };

    const onStart = (x) => {
      isDragging = true;
      startX = x;
      currentX = x;
      width = viewport.clientWidth;
      viewport.classList.add("dragging");
      track.classList.add("no-transition");
    };

    const onMove = (x) => {
      if (!isDragging) return;
      currentX = x;
      const delta = currentX - startX;
      track.style.transform = `translateX(calc(-${index * 100}% + ${delta}px))`;
    };

    const onEnd = () => {
      if (!isDragging) return;
      isDragging = false;
      viewport.classList.remove("dragging");
      const delta = currentX - startX;
      const threshold = width * 0.2;
      if (delta > threshold) goTo(index - 1);
      else if (delta < -threshold) goTo(index + 1);
      else goTo(index);
    };

    viewport.addEventListener("touchstart", e => onStart(e.touches[0].clientX), { passive: true });
    viewport.addEventListener("touchmove", e => onMove(e.touches[0].clientX), { passive: true });
    viewport.addEventListener("touchend", onEnd);

    viewport.addEventListener("mousedown", e => { e.preventDefault(); onStart(e.clientX); });
    window.addEventListener("mousemove", e => onMove(e.clientX));
    window.addEventListener("mouseup", onEnd);

    leftArrow.addEventListener("click", () => goTo(index - 1));
    rightArrow.addEventListener("click", () => goTo(index + 1));

    goTo(0, false);
  });
</script>
</body>
</html>
