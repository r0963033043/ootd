<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Today's Dress</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1a1d24 0%, #0d1117 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    color: #e6e8eb;
  }

  h1 {
    color: #f0f2f5;
    margin-bottom: 8px;
    font-size: 28px;
  }

  .subtitle {
    color: #8b94a3;
    margin-bottom: 24px;
    font-size: 14px;
  }

  .weather {
    width: 100%;
    max-width: 360px;
    background: linear-gradient(135deg, #1e3a5f 0%, #0f2540 100%);
    color: #e6e8eb;
    border-radius: 18px;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    user-select: none;
    position: relative;
    z-index: 2;
  }

  .weather-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px 20px 6px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    opacity: 0.95;
  }

  .weather-pin {
    font-size: 12px;
    line-height: 1;
  }

  .weather-updated {
    margin-left: auto;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2px;
    color: rgba(230, 232, 235, 0.6);
  }

  .weather.loading .weather-viewport,
  .weather.loading .weather-dots {
    animation: weather-pulse 1.2s ease-in-out infinite;
  }

  @keyframes weather-pulse {
    0%, 100% { opacity: 0.45; }
    50%      { opacity: 0.8; }
  }

  .weather-viewport {
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
  }

  .weather-viewport.dragging { cursor: grabbing; }

  .weather-track {
    display: flex;
    transition: transform 0.3s ease;
  }

  .weather-track.no-transition { transition: none; }

  .weather-page {
    flex: 0 0 100%;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 96px;
  }

  .weather-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 0 0 10px;
  }

  .weather-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    transition: background 0.2s, width 0.2s;
    cursor: pointer;
  }

  .weather-dot.active {
    background: rgba(255, 255, 255, 0.95);
    width: 16px;
    border-radius: 3px;
  }

  .weather-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .weather-day {
    font-size: 11px;
    opacity: 0.85;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .weather-location {
    font-size: 12px;
    opacity: 0.85;
    letter-spacing: 0.5px;
  }

  .weather-feels {
    font-size: 10px;
    opacity: 0.7;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .weather-temp {
    font-size: 32px;
    font-weight: 600;
    line-height: 1.1;
    display: inline-block;
    align-self: flex-start;
  }

  .has-real {
    position: relative;
    cursor: help;
  }

  .has-real::after {
    content: "Real " attr(data-real);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 5;
  }

  .has-real:hover::after { opacity: 1; }

  .has-alt {
    position: relative;
    cursor: help;
  }

  .has-alt::after {
    content: attr(data-alt);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 5;
  }

  .has-alt:hover::after { opacity: 1; }

  .weather-page[data-day="tomorrow"] .weather-hilo {
    font-size: 22px;
    font-weight: 600;
    margin-top: 6px;
  }

  .weather-page[data-day="tomorrow"] .weather-hilo .sep {
    font-weight: 400;
  }

  .weather-hilo {
    font-size: 12px;
    opacity: 0.9;
    margin-top: 2px;
  }

  .weather-hilo .sep {
    opacity: 0.5;
    margin: 0 4px;
  }

  .weather-condition {
    font-size: 13px;
    opacity: 0.95;
  }

  .weather-rain {
    font-size: 12px;
    opacity: 0.9;
    margin-top: 2px;
  }

  .weather-right {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .weather-icon {
    font-size: 44px;
    line-height: 1;
  }

  .weather-suggest {
    font-size: 11px;
    opacity: 0.9;
    text-align: right;
    max-width: 110px;
  }

  .outfit {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .block {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    overflow: hidden;
    user-select: none;
    border: 1px solid #2a2f3a;
  }

  .block-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: #16191f;
    border-bottom: 1px solid #2a2f3a;
    font-size: 13px;
    font-weight: 600;
    color: #8b94a3;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .counter {
    font-size: 11px;
    color: #5c6371;
    letter-spacing: 0;
    text-transform: none;
  }

  .viewport {
    position: relative;
    height: 160px;
    overflow: hidden;
    touch-action: pan-y;
    cursor: grab;
  }

  .viewport.dragging { cursor: grabbing; }

  .track {
    display: flex;
    height: 100%;
    transition: transform 0.3s ease;
  }

  .track.no-transition { transition: none; }

  .item {
    flex: 0 0 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px;
  }

  .item-icon {
    font-size: 60px;
    line-height: 1;
  }

  .item-name {
    font-size: 16px;
    font-weight: 500;
    color: #2c3e50;
      /*color: #e6e8eb;*/
  }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(40, 45, 55, 0.9);
    border: 1px solid #2a2f3a;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    color: #b8c0cc;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    transition: background 0.15s, color 0.15s;
  }

  .arrow:hover { background: #2a2f3a; color: #f0f2f5; }
  .arrow.left { left: 8px; }
  .arrow.right { right: 8px; }

  .hint {
    margin-top: 16px;
    font-size: 12px;
    color: #6b7280;
  }
</style>
</head>
<body>
  <h1>Today's Dress</h1>
  <p class="subtitle">Swipe each block to pick your look</p>

  <div class="weather loading" id="weather">
    <div class="weather-header">
      <span class="weather-pin">📍</span>
      <span data-field="location">Locating…</span>
      <span class="weather-updated" data-field="updated"></span>
    </div>
    <div class="weather-viewport">
      <div class="weather-track">
        <div class="weather-page" data-day="today">
          <div class="weather-left">
            <span class="weather-day">Today</span>
            <span class="weather-feels">Feels like</span>
            <span class="weather-temp" data-field="temp">--°</span>
            <span class="weather-hilo">
              L: <span data-field="lo">--°</span>
              <span class="sep">·</span>
              H: <span data-field="hi">--°</span>
            </span>
            <span class="weather-condition" data-field="condition">Loading weather</span>
            <span class="weather-rain" data-field="rain"></span>
          </div>
          <div class="weather-right">
            <span class="weather-icon" data-field="icon">⛅</span>
            <span class="weather-suggest" data-field="suggest"></span>
          </div>
        </div>
        <div class="weather-page" data-day="tomorrow">
          <div class="weather-left">
            <span class="weather-day">Tomorrow</span>
            <span class="weather-feels">Feels like</span>
            <span class="weather-hilo">
              L: <span data-field="lo">--°</span>
              <span class="sep">·</span>
              H: <span data-field="hi">--°</span>
            </span>
            <span class="weather-condition" data-field="condition">Loading…</span>
            <span class="weather-rain" data-field="rain"></span>
          </div>
          <div class="weather-right">
            <span class="weather-icon" data-field="icon">⛅</span>
            <span class="weather-suggest" data-field="suggest"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="weather-dots">
      <span class="weather-dot active" data-index="0"></span>
      <span class="weather-dot" data-index="1"></span>
    </div>
  </div>

  <div class="outfit">
    <div class="block" data-category="top">
      <div class="block-label">
        <span>Top</span>
        <span class="counter"></span>
      </div>
      <div class="viewport">
        <div class="track"></div>
        <div class="arrow left">&#10094;</div>
        <div class="arrow right">&#10095;</div>
      </div>
    </div>

    <div class="block" data-category="bottom">
      <div class="block-label">
        <span>Bottom</span>
        <span class="counter"></span>
      </div>
      <div class="viewport">
        <div class="track"></div>
        <div class="arrow left">&#10094;</div>
        <div class="arrow right">&#10095;</div>
      </div>
    </div>

    <div class="block" data-category="footwear">
      <div class="block-label">
        <span>Footwear</span>
        <span class="counter"></span>
      </div>
      <div class="viewport">
        <div class="track"></div>
        <div class="arrow left">&#10094;</div>
        <div class="arrow right">&#10095;</div>
      </div>
    </div>
  </div>

  <p class="hint">Tip: drag, swipe, or use the arrows</p>

<script src="api.js"></script>
<script>
  const WMO = {
    0:  { icon: "☀️", text: "Clear sky" },
    1:  { icon: "🌤️", text: "Mainly clear" },
    2:  { icon: "⛅", text: "Partly cloudy" },
    3:  { icon: "☁️", text: "Overcast" },
    45: { icon: "🌫️", text: "Fog" },
    48: { icon: "🌫️", text: "Rime fog" },
    51: { icon: "🌦️", text: "Light drizzle" },
    53: { icon: "🌦️", text: "Drizzle" },
    55: { icon: "🌧️", text: "Heavy drizzle" },
    61: { icon: "🌧️", text: "Light rain" },
    63: { icon: "🌧️", text: "Rain" },
    65: { icon: "🌧️", text: "Heavy rain" },
    71: { icon: "🌨️", text: "Light snow" },
    73: { icon: "🌨️", text: "Snow" },
    75: { icon: "❄️", text: "Heavy snow" },
    80: { icon: "🌦️", text: "Rain showers" },
    81: { icon: "🌧️", text: "Rain showers" },
    82: { icon: "⛈️", text: "Violent showers" },
    95: { icon: "⛈️", text: "Thunderstorm" },
    96: { icon: "⛈️", text: "Thunderstorm + hail" },
    99: { icon: "⛈️", text: "Severe storm" }
  };

  function suggestOutfit(tempC, code) {
    if ([61,63,65,80,81,82,95,96,99].includes(code)) return "Bring an umbrella";
    if ([71,73,75].includes(code)) return "Bundle up, it's snowy";
    if (tempC >= 28) return "Stay cool & light";
    if (tempC >= 22) return "T-shirt weather";
    if (tempC >= 15) return "A light layer";
    if (tempC >= 8)  return "Wear a jacket";
    return "Bundle up warm";
  }

  const todayPage    = document.querySelector('.weather-page[data-day="today"]');
  const tomorrowPage = document.querySelector('.weather-page[data-day="tomorrow"]');

  function rainText(prob, mm) {
    if (prob == null) return "";
    if (prob < 20) return `🌂 No rain expected · ${prob}%`;
    const amount = mm != null && mm > 0 ? ` · ${mm}mm` : "";
    if (prob < 50) return `☂️ Slight chance of rain · ${prob}%${amount}`;
    if (prob < 80) return `🌧️ Likely rain · ${prob}%${amount}`;
    return `🌧️ Rain expected · ${prob}%${amount}`;
  }

  function fillPage(page, { feelsC, realC, code, feelsHi, feelsLo, realHi, realLo, rainProb, rainMm, label }) {
    const w = WMO[code] || { icon: "🌡️", text: "Unknown" };

    const fmt = (v, unit = "°") => Number.isFinite(v) ? `${v}${unit}` : `--${unit}`;
    const setFeelsReal = (el, feels, real, unit = "°") => {
      if (!el) return;
      el.textContent = fmt(feels, unit);
      if (Number.isFinite(real) && real !== feels) {
        el.classList.add("has-real");
        el.setAttribute("data-real", fmt(real, unit));
      } else {
        el.classList.remove("has-real");
        el.removeAttribute("data-real");
      }
    };

    if (feelsC !== undefined) {
      setFeelsReal(page.querySelector('[data-field="temp"]'), feelsC, realC, "°C");
    }
    setFeelsReal(page.querySelector('[data-field="lo"]'), feelsLo, realLo);
    setFeelsReal(page.querySelector('[data-field="hi"]'), feelsHi, realHi);

    page.querySelector('[data-field="condition"]').textContent = w.text;
    page.querySelector('[data-field="icon"]').textContent      = w.icon;
    page.querySelector('[data-field="suggest"]').textContent   = suggestOutfit(feelsLo ?? feelsHi, code);

    const rainEl = page.querySelector('[data-field="rain"]');
    if (rainEl) rainEl.textContent = rainText(rainProb, rainMm);
  }

  function setLocation(label) {
    const locField = document.querySelector('.weather-header [data-field="location"]');
    if (!locField || !label) return;
    const localName = label.local || label.en || "Your location";
    locField.textContent = localName;
    if (label.en && label.en !== localName) {
      locField.classList.add("has-alt");
      locField.setAttribute("data-alt", label.en);
    } else {
      locField.classList.remove("has-alt");
      locField.removeAttribute("data-alt");
    }
  }

  function setLoading(loading) {
    document.getElementById("weather")?.classList.toggle("loading", loading);
  }

  function relativeTime(ts) {
    const min = Math.floor((Date.now() - ts) / 60000);
    if (min < 1)   return "just now";
    if (min < 60)  return `${min}m ago`;
    const hr = Math.floor(min / 60);
    if (hr < 24)   return `${hr}h ago`;
    return `${Math.floor(hr / 24)}d ago`;
  }

  let lastUpdatedTs = null;

  function setUpdated(ts) {
    const el = document.querySelector('.weather-header [data-field="updated"]');
    if (!el || !ts) return;
    lastUpdatedTs = ts;
    el.textContent = `Updated ${relativeTime(ts)}`;
    el.classList.add("has-alt");
    el.setAttribute("data-alt", new Date(ts).toLocaleString());
  }

  setInterval(() => { if (lastUpdatedTs) setUpdated(lastUpdatedTs); }, 60000);

  const WEATHER_CACHE = "ootd-weather-v1";

  function saveCache(payload) {
    try { localStorage.setItem(WEATHER_CACHE, JSON.stringify(payload)); } catch {}
  }

  function restoreCache() {
    try { return JSON.parse(localStorage.getItem(WEATHER_CACHE)); } catch { return null; }
  }

  function renderWeather({ today, tomorrow, label, ts }) {
    if (label)    setLocation(label);
    if (today)    fillPage(todayPage, today);
    if (tomorrow) fillPage(tomorrowPage, tomorrow);
    if (ts)       setUpdated(ts);
  }

  async function loadWeather() {
    const cached = restoreCache();
    if (cached) renderWeather(cached);

    const fetchWeather = async (lat, lon, label) => {
      const res = await fetch(buildWeatherUrl(lat, lon));
      const data = await res.json();

      const roundOrNull = v => v == null ? null : Math.round(v);

      const today = {
        feelsC:  Math.round(data.current.apparent_temperature),
        realC:   Math.round(data.current.temperature_2m),
        code:    data.current.weather_code,
        feelsHi: Math.round(data.daily.apparent_temperature_max[0]),
        feelsLo: Math.round(data.daily.apparent_temperature_min[0]),
        realHi:  Math.round(data.daily.temperature_2m_max[0]),
        realLo:  Math.round(data.daily.temperature_2m_min[0]),
        rainProb: data.daily.precipitation_probability_max?.[0],
        rainMm:  roundOrNull(data.daily.precipitation_sum?.[0]),
      };

      const tomorrow = {
        code:    data.daily.weather_code[1],
        feelsHi: Math.round(data.daily.apparent_temperature_max[1]),
        feelsLo: Math.round(data.daily.apparent_temperature_min[1]),
        realHi:  Math.round(data.daily.temperature_2m_max[1]),
        realLo:  Math.round(data.daily.temperature_2m_min[1]),
        rainProb: data.daily.precipitation_probability_max?.[1],
        rainMm:  roundOrNull(data.daily.precipitation_sum?.[1])
      };

      const ts = Date.now();
      renderWeather({ today, tomorrow, label, ts });
      saveCache({ today, tomorrow, label, ts });
      setLoading(false);
    };

    const fallback = async () => {
      try { await fetchWeather(25.0330, 121.5654, { local: "臺北", en: "Taipei" }); }
      catch {
        setLoading(false);
        setLocation({ local: "Weather unavailable" });
        todayPage.querySelector('[data-field="condition"]').textContent = "";
      }
    };

    const COUNTRY_LANG = {
      tw: "zh-TW", cn: "zh-CN", hk: "zh-HK", mo: "zh", sg: "zh",
      jp: "ja", kr: "ko", th: "th", vn: "vi",
      fr: "fr", de: "de", es: "es", it: "it", pt: "pt", nl: "nl",
      ru: "ru", ua: "uk", pl: "pl", tr: "tr",
      gr: "el", il: "he", sa: "ar", ae: "ar", eg: "ar"
    };

    const reverseGeocode = async (lat, lon) => {
      const fetchNom = async (lang) => {
        const res = await fetch(buildGeocodeUrl(lat, lon, lang));
        return res.json();
      };
      const pickDistrict = (a) => a?.suburb || a?.city_district || a?.district || a?.quarter || a?.neighbourhood || a?.borough;
      const pickCity     = (a) => a?.city || a?.town || a?.village || a?.county || a?.state;
      const compose = (a) => {
        const d = pickDistrict(a), c = pickCity(a);
        if (d && c && d !== c) return `${d}, ${c}`;
        return d || c || "";
      };
      try {
        const enData = await fetchNom("en");
        const cc = (enData?.address?.country_code || "").toLowerCase();
        const localLang = COUNTRY_LANG[cc];
        const localData = localLang ? await fetchNom(localLang) : enData;
        return {
          local: compose(localData?.address) || compose(enData?.address) || "Your location",
          en:    compose(enData?.address)
        };
      } catch {
        return { local: "Your location", en: "" };
      }
    };

    if (!navigator.geolocation) return fallback();

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude } = pos.coords;
        try {
          const label = await reverseGeocode(latitude, longitude);
          await fetchWeather(latitude, longitude, label);
        }
        catch { fallback(); }
      },
      () => fallback(),
      { timeout: 6000 }
    );
  }

  loadWeather();

  function makeSwipe(viewport, track, { count, wrap = false, onIndex }) {
    let index = 0;
    let startX = 0, currentX = 0, isDragging = false;
    let width = viewport.clientWidth;

    const slideTo = (i, animate = true) => {
      index = wrap
        ? ((i % count) + count) % count
        : Math.max(0, Math.min(count - 1, i));
      track.classList.toggle("no-transition", !animate);
      track.style.transform = `translateX(-${index * 100}%)`;
      onIndex?.(index);
    };

    const onStart = (x) => {
      isDragging = true;
      startX = x; currentX = x;
      width = viewport.clientWidth;
      viewport.classList.add("dragging");
      track.classList.add("no-transition");
    };

    const onMove = (x) => {
      if (!isDragging) return;
      currentX = x;
      const delta = currentX - startX;
      track.style.transform = `translateX(calc(-${index * 100}% + ${delta}px))`;
    };

    const onEnd = () => {
      if (!isDragging) return;
      isDragging = false;
      viewport.classList.remove("dragging");
      const delta = currentX - startX;
      const threshold = width * 0.2;
      if (delta > threshold) slideTo(index - 1);
      else if (delta < -threshold) slideTo(index + 1);
      else slideTo(index);
    };

    viewport.addEventListener("touchstart", e => onStart(e.touches[0].clientX), { passive: true });
    viewport.addEventListener("touchmove",  e => onMove(e.touches[0].clientX),  { passive: true });
    viewport.addEventListener("touchend",   onEnd);
    viewport.addEventListener("mousedown",  e => { e.preventDefault(); onStart(e.clientX); });
    window.addEventListener("mousemove", e => onMove(e.clientX));
    window.addEventListener("mouseup", onEnd);

    return {
      slideTo,
      next: () => slideTo(index + 1),
      prev: () => slideTo(index - 1),
    };
  }

  (function setupWeatherSwipe() {
    const viewport = document.querySelector(".weather-viewport");
    const track    = document.querySelector(".weather-track");
    const dots     = document.querySelectorAll(".weather-dot");

    const swipe = makeSwipe(viewport, track, {
      count: track.children.length,
      onIndex: (i) => dots.forEach((d, n) => d.classList.toggle("active", n === i)),
    });
    dots.forEach((d, n) => d.addEventListener("click", () => swipe.slideTo(n)));
    swipe.slideTo(0, false);
  })();

  const wardrobe = {
    top: [
      { icon: "👕", name: "White T-Shirt" },
      { icon: "👔", name: "Blue Shirt" },
      { icon: "🧥", name: "Denim Jacket" },
      { icon: "🥋", name: "Knit Sweater" },
      { icon: "🎽", name: "Tank Top" }
    ],
    bottom: [
      { icon: "👖", name: "Blue Jeans" },
      { icon: "🩳", name: "Khaki Shorts" },
      { icon: "👗", name: "Black Skirt" },
      { icon: "🩱", name: "Chinos" }
    ],
    footwear: [
      { icon: "👟", name: "White Sneakers" },
      { icon: "👞", name: "Brown Loafers" },
      { icon: "🥾", name: "Hiking Boots" },
      { icon: "🩴", name: "Sandals" },
      { icon: "👠", name: "Heels" }
    ]
  };

  document.querySelectorAll(".block").forEach(block => {
    const category = block.dataset.category;
    const items = wardrobe[category];
    const track = block.querySelector(".track");
    const viewport = block.querySelector(".viewport");
    const counter = block.querySelector(".counter");
    const leftArrow = block.querySelector(".arrow.left");
    const rightArrow = block.querySelector(".arrow.right");

    items.forEach(item => {
      const el = document.createElement("div");
      el.className = "item";

      const iconEl = document.createElement("div");
      iconEl.className = "item-icon";
      iconEl.textContent = item.icon;

      const nameEl = document.createElement("div");
      nameEl.className = "item-name";
      nameEl.textContent = item.name;

      el.append(iconEl, nameEl);
      track.appendChild(el);
    });

    const swipe = makeSwipe(viewport, track, {
      count: items.length,
      wrap: true,
      onIndex: (i) => { counter.textContent = `${i + 1} / ${items.length}`; },
    });
    leftArrow.addEventListener("click", () => swipe.prev());
    rightArrow.addEventListener("click", () => swipe.next());
    swipe.slideTo(0, false);
  });
</script>
</body>
</html>
